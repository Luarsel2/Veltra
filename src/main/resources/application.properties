# ===== Base de datos H2 =====
# Los datos se guardan en un archivo real dentro de tu proyecto (carpeta /data),
# así que no se pierden cada vez que reinicias el servidor.
spring.datasource.url=jdbc:h2:file:./data/veltradb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Crea/actualiza automáticamente las tablas según nuestras clases @Entity
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Panel visual para ver los datos guardados desde el navegador
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===== Configuración de correo (Gmail) =====
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USERNAME}
spring.mail.password=${GMAIL_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# A qué correo quieres que lleguen los mensajes del formulario.
app.contacto.destino=${GMAIL_USERNAME}
