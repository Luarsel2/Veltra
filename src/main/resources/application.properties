spring.mail.host=smtp.gmail.com
spring.mail.port=587
# Fallback local: Usa variables de entorno si existen (Render); si no, usa el valor por defecto.
spring.mail.username=${GMAIL_USERNAME:tu_correo@gmail.com}
spring.mail.password=${GMAIL_APP_PASSWORD:tu_contraseña_de_aplicacion}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Tiempos de espera ampliados (en milisegundos)
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

app.contacto.destino=${GMAIL_USERNAME:tu_correo@gmail.com}